<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - OA Design Studio</title>
    <meta name="description" content="OA Design Studio의 포트폴리오와 작업물을 확인하세요">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/works.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/icon_32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/icon_16x16.png">
    <link rel="apple-touch-icon" sizes="192x192" href="favicon/icon_192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/icon_512x512.png">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/0470599ade.js" crossorigin="anonymous"></script>

</head>
<body data-no-auto-footer="true">
    <!-- Background Video -->
    <!-- <video autoplay muted loop class="background-video">
        <source src="assets/bg.mp4" type="video/mp4">
    </video> -->
    
    <!-- Background Overlay -->
    <div class="background-overlay"></div>
    
    <!-- Mobile Header -->
    <div id="mobile-header-container">
    </div>
    
    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu-overlay-container">
    </div>
    
    <!-- Desktop Layout -->
    <div class="instagram-layout">
        <!-- Left Sidebar -->
        <aside id="sidebar-container">
        </aside>

        <!-- Main Content Area - WORKS PAGE CONTENT -->
        <main class="main-content">
            <!-- Works Header -->
            <section class="page-header">
                <div class="page-header-content">
                    <h1 class="page-title">Works</h1>
                    <!-- <p class="page-subtitle">다양한 프로젝트와 작업물을 만나보세요</p> -->
                </div>
            </section>

            <!-- Category Filter -->
            <section class="works-categories">
                <div class="category-container">
                    <button class="category-btn active" data-category="all">전체</button>
                    <button class="category-btn" data-category="web">웹 개발</button>
                    <button class="category-btn" data-category="print">인쇄물</button>
                    <button class="category-btn" data-category="ppt">PPT 디자인</button>
                    <button class="category-btn" data-category="ai">AI 콘텐츠</button>
                </div>
            </section>

            <!-- Works Grid -->
            <section class="works-grid-section">
                <div class="works-container">
                    <div class="works-grid" id="works-grid">
                        <!-- Dynamically loaded from works.json -->
                    </div>
                </div>
            </section>

            <!-- Footer Container (will be loaded dynamically) -->
            <div id="footer-container"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/components.js"></script>
    <script src="js/works.js"></script>

    <script>
        // Works Grid Loader
        class WorksGridLoader {
            constructor() {
                this.worksData = [];
                this.filteredWorks = [];
                this.currentFilter = 'all';
                this.init();
            }

            async init() {
                await this.loadWorksData();
                this.renderWorks();
                this.setupCategoryFilters();
            }

            async loadWorksData() {
                try {
                    const response = await fetch('data/works.json');
                    const data = await response.json();
                    this.worksData = data.works.filter(work => work.enabled);
                    this.filteredWorks = this.worksData;
                } catch (error) {
                    console.error('Error loading works data:', error);
                }
            }

            renderWorks() {
                const grid = document.getElementById('works-grid');
                grid.innerHTML = '';

                this.filteredWorks.forEach(work => {
                    const card = this.createWorkCard(work);
                    grid.appendChild(card);
                });
            }

            createWorkCard(work) {
                const article = document.createElement('article');
                article.className = 'work-card';
                article.setAttribute('data-category', work.category);

                const target = work.target === '_blank' ? 'target="_blank"' : '';

                article.innerHTML = `
                    <a href="${work.link}" class="work-card-link" ${target}>
                        <div class="work-card-image">
                            <img src="${work.image}" alt="${work.title}">
                            <div class="work-card-overlay"></div>
                        </div>
                        <div class="work-card-content">
                            <h3 class="work-title">${work.title}</h3>
                            <p class="work-description">${work.description}</p>
                            <div class="work-meta">
                                <span class="work-date">${work.date}</span>
                                <span class="work-client">${work.client}</span>
                            </div>
                        </div>
                    </a>
                `;

                return article;
            }

            setupCategoryFilters() {
                const categoryBtns = document.querySelectorAll('.category-btn');
                categoryBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const category = e.target.getAttribute('data-category');
                        this.filterByCategory(category);

                        // Update active button
                        categoryBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                    });
                });
            }

            filterByCategory(category) {
                this.currentFilter = category;

                if (category === 'all') {
                    this.filteredWorks = this.worksData;
                } else {
                    this.filteredWorks = this.worksData.filter(work => work.category === category);
                }

                this.renderWorks();
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new WorksGridLoader();
        });
    </script>
</body>
</html>
